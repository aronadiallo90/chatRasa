version: "3.1"

intents:
  - greet
  - ask_account_creation
  - ask_login
  - fallback
  - go_back_pgde
  - choose_platform
  - ask_password_reset
  - provide_name
  - go_back_greet_with_name
  - go_back_ecarriere
  - go_back_autres
  - ask_support
  - provide_email
  - provide_cni
  - confirm_has_account
  - deny_has_account
  - confirm_has_access
  - deny_has_access
  - start_account_verification
  - E_carriere
  - PGDE
  - CRCE
  - Attestation
  - ask_account_blocked
  - access_services
  - ask_attestation_request
  - ask_attestation_status
  - ask_attestation_info
  - ask_attestation_account
  - chitchat
  - chitchat/ask_email
  - chitchat/ask_cni
  - ask_dossier_number
  - affirm
  - confirm_password_reset
  - deny_password_reset
  - provide_matricule
  - voir_actes
  - voir_projets
  - aucun_projet_acte
  - retour_menu_utilisateur
  - reset_password_ecarriere
  - confirm_reset_ecarriere
  - cancel_reset_ecarriere
  - refuse_name

entities:
  - nom
  - platform
  - email
  - cni
  - matricule 
slots:
  platform:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: platform
  nom:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  nom_officiel:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  username:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  dossier_number:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  user_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  matricule:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: matricule
      - type: from_text
        intent: provide_matricule
  agent_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: email
      - type: from_text
        intent: provide_email
  cni:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: cni
      - type: from_text
        intent: provide_cni
  has_account:
    type: categorical
    values:
      - Oui
      - Non
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: confirm_has_account
        value: "Oui"
      - type: from_intent
        intent: deny_has_account
        value: "Non"
        
  has_access:
    type: categorical
    values:
      - Oui
      - Non
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: confirm_has_access
        value: "Oui"
      - type: from_intent
        intent: deny_has_access
        value: "Non"
responses:
  utter_greet:
    - text: "Dalal ak Jàmm 😊 ! Je suis Amath, le chatbot🤖 du Ministère de la Fonction Publique et de la Réforme du Service Public.\nPuis-je connaître votre nom, s'il vous plaît ?"
  utter_greet_with_name:
  - text: "Bienvenue {nom} ! 👋\n**En quoi puis-je vous aider aujourd'hui ?**"
    buttons:
      - title: "💼E-Carrière"
        payload: '/choose_platform{{"platform": "E-Carrière"}}'
      - title: "🎯Demande d'emploi (PGDE)"
        payload: '/choose_platform{{"platform": "PGDE"}}'
      # - title: "📜 Reconnaissance de diplôme (CRCE)"
      #   payload: '/choose_platform{{"platform": "CRCE"}}'
      - title: "📄 Attestation de non appartenance"
        payload: '/choose_platform{{"platform": "Attestation"}}'
  utter_E_carriere:
    - text: "Bienvenue sur **E-Carrière** 🧾,La plateforme dédiée au suivi des actes administratifs liés à votre carrière dans la fonction publique du Sénégal.\nPrêt·e à suivre l'évolution de vos dossiers ?😊\n👉 Avez-vous déjà un compte sur la plateforme ?"
      buttons:
        - title: "✅ Oui"
          payload: "/confirm_has_account"
        - title: "❌ Non"
          payload: "/deny_has_account"
  utter_ask_account_creation:
    - text: "Pour **activer** votre compte :\n\n⭐ Allez sur notre site en **[cliquant sur ce lien👆](https://e-carriere.sec.gouv.sn/#/login)**  \n\n⭐ **Remplissez** les informations demandées avec attention :\n\n⭐ Votre **Matricule** doit être en MAJUSCULES et sans slash (/).\n\n⭐ Votre **Nom** doit être en MAJUSCULES.\n\n⭐ Votre **Prénom** doit être saisi exactement comme sur votre CNI.\n\n⭐ Suivez ensuite les instructions pour finaliser l'activation de votre compte."
      buttons:
        - title: "Retour"
          payload: "/go_back_ecarriere"
  utter_ask_login:
    - text: "Pour vous **connecter** à E-Carrière:\n\n⭐ Allez sur notre site en **[cliquant sur ce lien👆](https://e-carriere.sec.gouv.sn/#/login)** \n\n⭐ **Cliquez** sur 'Connexion'.\n\n⭐ **Entrez vos identifiants** (Matricule et Mot de passe).\n\n⭐ Cliquez sur **'Se connecter'** pour accéder à votre espace personnel."
      buttons:
        - title: "Retour"
          payload: "/go_back_ecarriere"
  utter_ask_password_reset:
    - text: "1. **Se rendre** sur la page de connexion.\n2. **Cliquer** sur \"**Mot de passe oublié ?**\".\n3. **Saisir** son adresse email associée à son compte.\n4.Vous allez **Recevoir** un email et un message whatsapp contenant un **lien de réinitialisation**.\n5. **Cliquer** sur le lien reçu, **saisir un nouveau mot de passe**, et **confirmer.**\n✅Une fois réinitialisé, l’agent pourra se connecter avec son nouveau mot de passe."
      buttons:
        - title: "Retour"
          payload: "/go_back_ecarriere"
  utter_fallback:
    - text: "Je suis désolé, je ne connais pas la réponse à cette question."
      buttons:
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_pgde_menu:
    - text: "Excellent choix ! 🚀\n\nLa **PGDE** est une plateforme numérique permettant à **tous les Sénégalais**, qu'ils soient au pays ou dans la diaspora, de **postuler à des offres d'emploi dans la Fonction publique**.\n\nPrêt·e à explorer ? 😊\n\n👉 Avez-vous déjà un compte sur la plateforme ?"
      buttons:
        - title: "Oui"
          payload: "/confirm_has_account"
        - title: "Non"
          payload: "/deny_has_account"


  utter_ask_pgde_account_creation:
    - text: "Pour **créer** un compte sur la plateforme **PGDE** :\n\n1️⃣ Rendez-vous sur PGDE **[ en cliquant sur ce lien👆](https://emploi-fpublique.sec.gouv.sn/login).**\n\n2️⃣ Cliquez sur **Créer un compte**.\n\n3️⃣ **Remplissez** les informations demandées (Nom, Prénom, Email, etc.).\n\n4️⃣ Validez votre inscription via le mail de confirmation."
      buttons:
        - title: "🔄 Retour PGDE"
          payload: "/go_back_pgde"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
        - title: "📞 Support"
          payload: "/ask_support"
  utter_server_error:
    - text: "❌ **Erreur temporaire**\n\nUne erreur s'est produite. Veuillez réessayer dans quelques instants ou contacter le support."
      buttons:
        - title: "🔄 Réessayer"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
        - title: "📞 Support"
          payload: "/ask_support"

  utter_ask_pgde_login:
    - text: "Pour vous **connecter** à **PGDE** :\n\n1️⃣ Accédez à la page en  **[cliquant sur ce lien👆](https://emploi-fpublique.sec.gouv.sn/login).**\n\n2️⃣ Saisissez votre **email** et votre **mot de passe**.\n\n3️⃣ Cliquez sur **'Se connecter'**."
      buttons:                                                                                          
        - title: "🔄 Retour PGDE"
          payload: "/go_back_pgde"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
        - title: "📞 Support"
          payload: "/ask_support"
  utter_ask_pgde_password_reset:
    - text: "Vous pouvez utiliser **[ce lien👆](https://emploi-fpublique.sec.gouv.sn/resetting/request)** pour réinitialiser votre mot de passe.\nEn cas de problèmes ou de difficultés, veuillez nous contacter à l'adresse **emploi@fonctionpublique.gouv.sn** en indiquant **Mot de passe oublié** comme objet du message."
      buttons:                                                                                          
        - title: "🔄 Retour PGDE"
          payload: "/go_back_pgde"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
        - title: "📞 Support"
          payload: "/ask_support" 

  utter_crce_menu:
    - text: "Bienvenue sur **CRCE** 📜, la plateforme pour la reconnaissance des diplômes. Comment puis-je vous aider ?"
      buttons:
        - title: "Créer un compte"
          payload: "/ask_account_creation"
        - title: "Se connecter"
          payload: "/ask_login"
        - title: "Mot de passe oublié ?"
          payload: "/ask_password_reset"
        - title: "Vérifier mon compte"
          payload: "/start_account_verification"
        - title: "Retour"
          payload: "/go_back_greet_with_name"

  utter_attestation_menu:
    - text: "Bienvenue sur le service **Attestation de non appartenance** 📄\n\nCe service vous permet d'obtenir une attestation certifiant que vous n'appartenez pas à la fonction publique sénégalaise.\n\n❓ **Comment puis-je vous aider ?**"
      buttons:
        - title: "📋 À quoi ça sert ?"
          payload: "/ask_attestation_info"
        - title: "🔗 Comment créer un compte ?"
          payload: "/ask_attestation_account"
        - title: "📝 Comment postuler ?"
          payload: "/ask_attestation_request"
        - title: "📊 Suivre une demande"
          payload: "/ask_attestation_status"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_ask_attestation_info:
    - text: "📋 **À quoi sert l'Attestation de non appartenance ?**\n\nCette attestation certifie officiellement que vous **n'êtes pas** agent de la fonction publique sénégalaise.\n\n✅ **Elle est requise pour :**\n• Postuler à des offres d'emploi privées\n• S'inscrire à certains concours\n• Créer une entreprise\n• Justifier votre statut professionnel\n\n📄 **Document officiel** délivré par le Ministère de la Fonction Publique."
      buttons:
        - title: "🔗 Comment créer un compte ?"
          payload: "/ask_attestation_account"
        - title: "📝 Comment postuler ?"
          payload: "/ask_attestation_request"
        - title: "🔄 Retour Attestation"
          payload: "/choose_platform{\"platform\": \"Attestation\"}"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_ask_attestation_account:
    - text: "🔗 **Comment créer un compte pour l'Attestation ?**\n\n1️⃣ Rendez-vous sur la plateforme **[en cliquant sur ce lien👆](https://demarche.mfprsp.com/)**\n\n2️⃣ Cliquez sur **« S'inscrire »** ou **« Créer un compte »**\n\n3️⃣ **Remplissez** vos informations personnelles :\n   • Nom et Prénom\n   • Email\n   • Numéro de téléphone\n   • Mot de passe\n\n4️⃣ **Validez** votre inscription via l'email de confirmation\n\n✅ **Votre compte est prêt !** Vous pouvez maintenant faire votre demande."
      buttons:
        - title: "📝 Comment postuler ?"
          payload: "/ask_attestation_request"
        - title: "📊 Suivre une demande"
          payload: "/ask_attestation_status"
        - title: "🔄 Retour Attestation"
          payload: "/choose_platform{\"platform\": \"Attestation\"}"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_ask_attestation_request:
    - text: "📝 **Comment postuler pour une Attestation ?**\n\n**Étape 1 :** Connectez-vous sur **[demarche.mfprsp.com](https://demarche.mfprsp.com/)**\n\n**Étape 2 :** Cliquez sur **« Nouvelle demande »** ou **« Attestation de non appartenance »**\n\n**Étape 3 :** **Remplissez le formulaire** avec :\n   • Vos informations personnelles\n   • Motif de la demande\n   • Pièces justificatives (CNI, etc.)\n\n**Étape 4 :** **Soumettez** votre demande\n\n⏱️ **Délai de traitement :** 48-72h ouvrables\n📧 **Suivi :** Vous recevrez un email de confirmation"
      buttons:
        - title: "📊 Suivre une demande"
          payload: "/ask_attestation_status"
        - title: "🔗 Comment créer un compte ?"
          payload: "/ask_attestation_account"
        - title: "🔄 Retour Attestation"
          payload: "/choose_platform{\"platform\": \"Attestation\"}"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_ask_attestation_status:
    - text: "📊 **Comment suivre votre demande d'Attestation ?**\n\n**Option 1 :** Connectez-vous sur **[demarche.mfprsp.com](https://demarche.mfprsp.com/)**\n   • Allez dans **« Mes demandes »**\n   • Consultez le statut en temps réel\n\n**Option 2 :** Vérifiez votre **email**\n   • Email de confirmation à la soumission\n   • Email de notification quand c'est prêt\n\n**Option 3 :** **SMS** (si activé)\n   • Notifications sur votre téléphone\n\n📋 **États possibles :**\n   • ⏳ En cours de traitement\n   • ✅ Attestation prête\n   • 📤 Envoyée par email\n\n⏱️ **Délai moyen :** 48-72h ouvrables"
      buttons:
        - title: "📝 Faire une nouvelle demande"
          payload: "/ask_attestation_request"
        - title: "📋 À quoi ça sert ?"
          payload: "/ask_attestation_info"
        - title: "🔄 Retour Attestation"
          payload: "/choose_platform{\"platform\": \"Attestation\"}"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_ask_support:
    - text: "Pour toute assistance, contactez-nous au +221 33 889 99 00 ou par email à support@fonctionpublique.gouv.sn (lundi-vendredi, 8h-17h)."
      buttons:
        - title: "Retour au menu principal"
          payload: "/go_back_greet_with_name"
  utter_chitchat:
    - text: "Je ne suis pas sûr de ce que vous voulez dire. Pouvez-vous préciser ?"
      buttons:
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_ask_email:
    - text: "Veuillez entrer votre adresse email pour vérifier votre compte."
  utter_ask_cni:  # Nouvelle réponse pour demander le CNI
    - text: "Super ! 🎉Pour vérifier votre compte, j'ai juste besoin de votre **numéro de CNI** (Carte nationale d'identité).\n💡Votre cni doit contenir 13 chiffres"
  utter_ask_cni_ecarriere:  # CNI pour E-Carrière
    - text: "Super ! 🎉Pour vérifier votre compte E-Carrière, j'ai besoin de votre **numéro de CNI** (Carte nationale d'identité).\n💡Votre cni doit contenir 13 chiffres"
  utter_ask_matricule:  # Demander matricule après CNI pour E-Carrière
    - text: "Parfait ! 👍Maintenant, j'ai besoin de votre **matricule solde**.\nVotre matricule doit être en MAJUSCULES et sans slash(/)"
  utter_chitchat/ask_email:  # Réponse pour l'intent chitchat/ask_email
    - text: "Votre adresse email est celle que vous avez utilisée lors de votre inscription sur la plateforme. Vérifiez vos emails pour retrouver les communications officielles."
  utter_chitchat/ask_cni:  # Réponse pour l'intent chitchat/ask_cni
    - text: "Pour connaître votre numéro de CNI, vérifiez votre Carte Nationale d'Identité sénégalaise. Ce numéro se trouve généralement au recto de votre carte."
  utter_ask_has_account:
    - text: "Avez-vous déjà un compte sur {platform} ?\n💡Si vous n'êtes pas sûr, choisissez 'Oui' et nous vérifierons ensemble*"
      buttons:
        - title: "✅ Oui"
          payload: "/confirm_has_account"
        - title: "❌ Non"
          payload: "/deny_has_account"
  utter_ask_has_access:
    - text: "Avez-vous accès à votre compte (identifiants valides) ?"
      buttons:
        - title: "Oui"
          payload: "/confirm_has_access"
        - title: "Non"
          payload: "/deny_has_access"
  utter_no_account:
    - text: "⚠️ **Compte introuvable**\n\nNous n'avons pas pu retrouver de compte avec les informations fournies.\n\n🔁 Veuillez vérifier vos données ou réessayer dans un instant."
      buttons:
        - title: "ℹ️ Comment créer un compte"
          payload: "/ask_account_creation"
        - title: "🔄 Réessayer"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
        - title: "📞 Support"
          payload: "/ask_support"
  utter_no_access:
    - text: "🔐 **Accès non reconnu**\n\nSi vous avez oublié vos identifiants ou rencontré un souci, vous pouvez demander une réinitialisation ou contacter le support."
      buttons:
        - title: "📝 Activer mon compte"
          payload: "/ask_account_creation"
        - title: "🔑 Se connecter"
          payload: "/ask_login"
        - title: "🔒 Mot de passe oublié"
          payload: "/ask_password_reset"
        - title: "🔄 Réessayer"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
        - title: "📞 Support"
          payload: "/ask_support"
  utter_account_verified:
    - text: "✅ **Votre compte a bien été vérifié !**\n Bienvenue **{nom}** 👋 \n Vous êtes maintenant connecté·e à votre espace personnel.Voici vos infos :\n\n👤 **Nom :** {nom}\n👥 **Nom d'utilisateur :** {username}\n📋 **Numéro de dossier :** {dossier_number}\n\n🔐 Avez-vous toujours accès à votre compte ?"
      buttons:
        - title: "✅ Oui, j'ai accès"
          payload: "/confirm_has_access"
        - title: "❌ Non, mot de passe oublié"
          payload: "/deny_has_access"
  utter_ecarriere_account_verified:
    - text: "**Compte trouvé ! ✅\n\nParfait {nom} ! Je vous retrouve bien dans E-Carrière. Voici vos infos :\n\n👤 **Nom :** {nom}\n🆔 **Matricule :** {matricule}\n📂 **Projets/Actes :** {projets}\n\n🔐 Avez-vous toujours accès à votre compte ?"
      buttons:
        - title: "✅ Oui, j'ai accès"
          payload: "/confirm_has_access"
        - title: "❌ Non, mot de passe oublié"
          payload: "/deny_has_access"
  utter_account_access_confirmed:
    - text: "✅ **Accès confirmé**.\n Vous pouvez vous connecter dès maintenant à votre espace personnel.\n🔗 [**Accéder à la plateforme**](https://emploi-fpublique.sec.gouv.sn/login)\n\n✨ Bonne chance dans vos démarches ! 🤝"
      buttons:
        - title: "🔄 Autre vérification"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_confirm_password_reset:
    - text: "Pas de panique {nom}, ça arrive\nPour réinitialiser votre mot de passe, je vais envoyer un lien de réinitialisation à votre adresse email :\n\n📧 {email}\n\nConfirmez-vous cette réinitialisation ?"
      buttons:
        - title: "Oui, réinitialiser"
          payload: "/confirm_password_reset"
        - title: "Non, annuler"
          payload: "/deny_password_reset"
  utter_password_reset_success:
    - text: "✅ **Réinitialisation réussie !**\nUn lien de réinitialisation a été envoyé à l'adresse : **{email}**.\n📬 Pensez à vérifier votre dossier *Spam* ou *Courrier indésirable*.\nUne fois votre mot de passe changé, vous pourrez vous connecter :\n\n[Se connecter à PGDE](https://emploi-fpublique.sec.gouv.sn/login)"
      buttons:
        - title: "🔄 Autre vérification"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_password_reset_cancelled:
    - text: "Réinitialisation annulée ❌\n\nSi vous vous souvenez de votre mot de passe, vous pouvez essayer de vous connecter :\n\n[Se connecter à PGDE](https://emploi-fpublique.sec.gouv.sn/login)"
      buttons:
        - title: "🔄 Autre vérification"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
  utter_dossier_number:
    - text: "📁 **Votre numéro de dossier est :** {dossier_number}**\nVous pouvez utiliser ce numéro pour suivre l'état de vos candidatures sur la plateforme PGDE."
      buttons:
        - title: "🔄 Autre vérification"
          payload: "/start_account_verification"
        - title: "🏠 Menu principal"
          payload: "/go_back_greet_with_name"
actions:
  - action_redirect_platform
  - action_explain_account_creation
  - action_explain_login
  - action_explain_password_reset
  - action_reset_nom
  - action_validate_account
  - action_handle_name
  - action_start_account_verification
  - action_handle_has_account
  - action_handle_has_access
  - action_handle_email
  - action_handle_cni
  - action_confirm_password_reset
  - action_deny_password_reset
  - action_get_dossier_number
  - action_reset_account_data
  - action_reset_for_new_platform
  - action_soft_reset
  - action_handle_matricule
  - action_voir_actes
  - action_voir_projets
  - action_aucun_projet_acte
  - action_retour_menu_utilisateur
  - action_reset_password_ecarriere
  - action_confirm_reset_ecarriere
  - action_cancel_reset_ecarriere
  - action_handle_fallback_after_greet
  




session_config:
  session_expiration_time: 5
  carry_over_slots_to_new_session: false