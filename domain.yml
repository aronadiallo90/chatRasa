version: "3.1"

intents:
  - greet
  - ask_account_creation
  - ask_login
  - fallback
  - go_back_pgde
  - choose_platform
  - ask_password_reset
  - provide_name
  - go_back_greet_with_name
  - go_back_ecarriere
  - go_back_autres
  - ask_support
  - provide_email
  - confirm_has_account
  - deny_has_account
  - confirm_has_access
  - deny_has_access
  - start_account_verification
  - E_carriere
  - PGDE
  - CRCE
  - Attestation
  - ask_account_blocked
  - access_services
  - ask_attestation_request
  - ask_attestation_status

entities:
  - nom
  - platform
  - email
forms:
    account_creation_form:
      required_slots:
        - nom
        - email
        - has_account
    account_verification_form:
      required_slots:
        - email
        - has_account
        - has_access
slots:
  platform:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: platform
  nom:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: nom
      # - type: from_text
      #   conditions:
      #     - active_loop: null
  email:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: email
      # - type: from_text
      #   conditions:
      #     - active_loop: null
  has_account:
    type: categorical
    values:
      - yes
      - no
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: confirm_has_account
        value: yes
      - type: from_intent
        intent: deny_has_account
        value: no
  has_access:
    type: categorical
    values:
      - yes
      - no
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: confirm_has_access
        value: yes
      - type: from_intent
        intent: deny_has_access
        value: no

    # type: bool
    # influence_conversation: true
    # initial_value: false
    # mappings:
    #   - type: from_intent
    #     intent: confirm_has_account
    #     value: true
    #   - type: from_intent
    #     intent: deny_has_account
    #     value: false
responses:
  utter_greet:
    - text: "Bienvenue ! Je suis Amath, le chatbot🤖 du Ministère de la Fonction Publique et de la Réforme du Service Public.\n\n Dalal ak Jàmm 😊 !\n\n Pour commencer, puis-je connaître votre nom, s’il vous plaît ?"
  utter_greet_with_name:
    - text: "Bonjour {nom}.\n\n En quoi puis-je vous aider aujourd'hui ?"
      buttons:
        - title: "E-CARRIERE"
          payload: '/choose_platform{"platform": "E-Carrière"}'
        - title: "Demande d'emploi (PGDE)"
          payload: '/choose_platform{"platform": "PGDE"}'
        - title: "CRCE"
          payload: '/choose_platform{"platform": "CRCE"}'
        - title: "Attestation"
          payload: '/choose_platform{"platform": "Attestation"}'
  utter_E_carriere:
    - text: "Bienvenue sur **e-Carrière** 🧾, la plateforme dédiée à la gestion des carrières dans la fonction publique. Comment puis-je vous assister aujourd’hui ?"
      buttons:
        - title: "Comment Activer son compte"
          payload: "/ask_account_creation"
        - title: "Je n'arrive pas à me connecter"
          payload: "/ask_login"
        - title: "Mot de passe oublié"
          payload: "/ask_password_reset"
        - title: "Vérifier mon compte"
          payload: "/start_account_verification"
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_ask_account_creation:
    - text: "Pour vous **activer** son compte :\n\n⭐ Allez sur notre site en **[cliquant sur ce lien👆](https://e-carriere.sec.gouv.sn/#/login)**  \n\n⭐ **Remplissez** les informations demandées avec attention :\n\n⭐ Votre **Matricule** doit être en MAJUSCULES et sans slash (/).\n\n⭐ Votre **Nom** doit être en MAJUSCULES.\n\n⭐ Votre **Prénom** doit être saisi exactement comme sur votre CNI.\n\n⭐ Suivez ensuite suiver les instructions pour finaliser l’activation de votre compte."
      buttons:
        - title: "Retour"
          payload: "/go_back_ecarriere"
  utter_ask_login:
    - text: "Pour vous **connecter** à E-Carrière:\n\n⭐ Allez sur notre site en **[cliquant sur ce lien👆](https://e-carriere.sec.gouv.sn/#/login)** \n\n⭐ **Cliquez** sur 'Connexion'.\n\n⭐ **Entrez vos identifiants** (Matricule et Mot de passe).\n\n⭐ Cliquez sur **'Se connecter'** pour accéder à votre espace personnel."
      buttons:
        - title: "Retour"
          payload: "/go_back_ecarriere"
  utter_ask_password_reset:
    - text: "1. **Se rendre** sur la page de connexion.\n2. **Cliquer** sur \"**Mot de passe oublié ?**\".\n3. **Saisir** son adresse email associée à son compte.\n4.Vous allez **Recevoir** un email et un message whatsapp contenant un **lien de réinitialisation**.\n5. **Cliquer** sur le lien reçu, **saisir un nouveau mot de passe**, et **confirmer.**\n✅Une fois réinitialisé, l’agent pourra se connecter avec son nouveau mot de passe."
      buttons:
        - title: "Retour"
          payload: "/go_back_ecarriere"
  utter_fallback:
    - text: "Je suis désolé, je ne connais pas la réponse à cette question."
      buttons:
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_pgde_menu:
    - text: "Vous souhaitez en savoir plus sur la **PGDE** 💼, la plateforme de gestion des demandes d’emploi à la fonction publique. En quoi puis-je vous aider ?"
      buttons:
        - title: "Je veux m'inscrire"
          payload: "/ask_account_creation"
        - title: "Se connecter"
          payload: "/ask_login"
        - title: "Mot de passe oublié?"
          payload: "/ask_password_reset"
        - title: "Vérifier mon compte"
          payload: "/start_account_verification"
        - title: "Retour"
          payload: "/go_back_greet_with_name"


  utter_ask_pgde_account_creation:
    - text: "Pour **créer** un compte sur la plateforme **PGDE** :\n\n⭐ Rendez-vous sur PGDE **[ en cliquant sur ce lien👆](https://emploi-fpublique.sec.gouv.sn/login).**\n\n⭐ Cliquez sur **Créer un compte**.\n\n⭐ **Remplissez** les informations demandées (Nom, Prénom, Email, etc.).\n\n⭐ Validez votre inscription via le mail de confirmation."
      buttons:
        - title: "Retour"
          payload: "/go_back_pgde"

  utter_ask_pgde_login:
    - text: "Pour vous **connecter** à **PGDE** :\n\n⭐ Accédez à la page en  **[cliquant sur ce lien👆](https://emploi-fpublique.sec.gouv.sn/login).**\n\n⭐ Saisissez votre **email** et votre **mot de passe**.\n\n⭐ Cliquez sur **'Se connecter'**."
      buttons:                                                                                          
        - title: "Retour"
          payload: "/go_back_pgde"
  utter_ask_pgde_password_reset:
    - text: "Vous pouvez utiliser **[ce lien👆](https://emploi-fpublique.sec.gouv.sn/resetting/request)** pour réinitialiser votre mot de passe.\nEn cas de problèmes ou de difficultés, veuillez nous contacter à l'adresse **emploi@fonctionpublique.gouv.sn** en indiquant **Mot de passe oublié** comme objet du message."
      buttons:                                                                                          
        - title: "Retour"
          payload: "/go_back_pgde" 

  utter_crce_menu:
    - text: "Bienvenue sur **CRCE** 📜, la plateforme pour la reconnaissance des diplômes. Comment puis-je vous aider ?"
      buttons:
        - title: "Créer un compte"
          payload: "/ask_account_creation"
        - title: "Se connecter"
          payload: "/ask_login"
        - title: "Mot de passe oublié ?"
          payload: "/ask_password_reset"
        - title: "Vérifier mon compte"
          payload: "/start_account_verification"
        - title: "Retour"
          payload: "/go_back_greet_with_name"

  utter_attestation_menu:
    - text: "Bienvenue sur le service **Attestation** 📄. Vous pouvez demander une attestation sans compte. Comment puis-je vous aider ?"
      buttons:
        - title: "Demander une attestation"
          payload: "/ask_attestation_request"
        - title: "Suivre une demande"
          payload: "/ask_attestation_status"
        - title: "Vérifier mon compte"
          payload: "/start_account_verification"
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_ask_support:
    - text: "Pour toute assistance, contactez-nous au +221 33 889 99 00 ou par email à support@fonctionpublique.gouv.sn (lundi-vendredi, 8h-17h)."
      buttons:
        - title: "Retour au menu principal"
          payload: "/go_back_greet_with_name"
  utter_ask_email:
    - text: "Veuillez entrer votre adresse email pour vérifier votre compte."
  utter_ask_has_account:
    - text: "Avez-vous déjà un compte sur {platform} ?"
      buttons:
        - title: "Oui"
          payload: "/confirm_has_account"
        - title: "Non"
          payload: "/deny_has_account"
  utter_ask_has_access:
    - text: "Avez-vous accès à votre compte (identifiants valides) ?"
      buttons:
        - title: "Oui"
          payload: "/confirm_has_access"
        - title: "Non"
          payload: "/deny_has_access"
  utter_no_account:
    - text: "Aucun compte trouvé pour cet email. Voulez-vous réessayer ou créer un compte ?"
      buttons:
        - title: "Réessayer"
          payload: "/provide_email"
        - title: "Créer un compte"
          payload: "/ask_account_creation"
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_no_access:
    - text: "Aucun accès au compte ? Sélectionnez une option :"
      buttons:
        - title: "Mot de passe oublié"
          payload: "/ask_password_reset"
        - title: "Compte bloqué"
          payload: "/ask_account_blocked"
        - title: "Retour"
          payload: "/go_back_greet_with_name"
  utter_account_verified:
    - text: "Votre compte est vérifié ! Vous pouvez maintenant accéder aux services de {platform}."
      buttons:
        - title: "Continuer"
          payload: "/access_services"
        - title: "Retour"
          payload: "/go_back_greet_with_name"
actions:
  - action_redirect_platform
  - action_explain_account_creation
  - action_explain_login
  - action_explain_password_reset
  - action_reset_nom
  # - action_validate_name
  - action_validate_account
  - account_verification_form


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true