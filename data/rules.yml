version: "3.1"

rules:

- rule: Répondre au salut de l'utilisateur
  steps:
    - intent: greet
    - action: utter_greet

- rule: Expliquer la création de compte
  steps:
    - intent: ask_account_creation
    - action: action_explain_account_creation

- rule: Expliquer la connexion
  steps:
    - intent: ask_login
    - action: action_explain_login

- rule: Expliquer la réinitialisation du mot de passe
  steps:
    - intent: ask_password_reset
    - action: action_explain_password_reset

- rule: Gérer une réponse inconnue
  steps:
    - intent: fallback
    - action: utter_fallback

- rule: Gérer le retour utilisateur vers E-Carrière
  steps:
    - intent: go_back_ecarriere
    - action: utter_E_carriere

- rule: Gérer le retour utilisateur vers PGDE
  steps:
    - intent: go_back_pgde
    - action: utter_pgde_menu

- rule: Gérer le retour utilisateur vers Autres plateformes
  steps:
    - intent: go_back_autres
    - action: utter_greet_with_name

- rule: Rediriger vers la plateforme choisie
  steps:
    - intent: choose_platform
    - action: action_redirect_platform

- rule: Retourner au menu principal avec le nom de l'utilisateur
  steps:
    - intent: go_back_greet_with_name
    - action: utter_greet_with_name

- rule: Saluer l'utilisateur avec le nom saisi
  steps:
    - intent: provide_name
    - action: utter_greet_with_name

