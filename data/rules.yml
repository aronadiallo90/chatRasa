version: "3.1"
rules:
  - rule: Aller vers E-Carrière par texte
    steps:
      - intent: E_carriere
      - action: utter_E_carriere

  - rule: Aller vers PGDE par texte
    steps:
      - intent: PGDE
      - action: utter_pgde_menu

  - rule: Aller vers CRCE par texte
    steps:
      - intent: CRCE
      - action: utter_crce_menu

  - rule: Aller vers Attestation par texte
    steps:
      - intent: Attestation
      - action: utter_attestation_menu

  - rule: Répondre au salut de l'utilisateur
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Expliquer la création de compte
    steps:
      - intent: ask_account_creation
      - action: action_explain_account_creation

  - rule: Expliquer la connexion
    steps:
      - intent: ask_login
      - action: action_explain_login

  - rule: Gérer une réponse inconnue
    steps:
      - intent: fallback
      - action: utter_fallback

  - rule: Gérer le retour utilisateur vers E-Carrière
    steps:
      - intent: go_back_ecarriere
      - action: utter_E_carriere

  - rule: Gérer le retour utilisateur vers PGDE
    steps:
      - intent: go_back_pgde
      - action: utter_pgde_menu

  - rule: Gérer le retour utilisateur vers Autres plateformes
    steps:
      - intent: go_back_autres
      - slot_was_set:
          - nom
      - action: utter_greet_with_name

  - rule: Rediriger vers la plateforme choisie
    steps:
      - intent: choose_platform
      - action: action_redirect_platform

  - rule: Retourner au menu principal avec le nom de l'utilisateur
    steps:
      - intent: go_back_greet_with_name
      - slot_was_set:
          - nom
      - action: utter_greet_with_name

  - rule: Saluer l'utilisateur avec le nom saisi
    steps:
      - intent: provide_name
      - slot_was_set:
          - nom
      - action: utter_greet_with_name

  - rule: Gérer la réinitialisation du mot de passe
    steps:
      - intent: ask_password_reset
      - action: action_explain_password_reset

  - rule: Gérer le compte bloqué
    steps:
      - intent: ask_account_blocked
      - action: utter_no_access

  - rule: Gérer la demande d'attestation
    steps:
      - intent: ask_attestation_request
      - action: utter_attestation_menu

  - rule: Gérer le suivi d'attestation
    steps:
      - intent: ask_attestation_status
      - action: utter_attestation_menu

  - rule: Demander le support technique
    steps:
      - intent: ask_support
      - action: utter_ask_support

  - rule: Demander le numéro de dossier
    steps:
      - intent: ask_dossier_number
      - action: action_get_dossier_number

  - rule: Activer le formulaire de vérification de compte
    steps:
      - intent: start_account_verification
      - action: account_verification_form
      - active_loop: account_verification_form
    wait_for_user_input: false

  - rule: Handle form responses during account verification
    condition:
      - active_loop: account_verification_form
    steps:
      - intent: confirm_has_account
      - action: account_verification_form
    wait_for_user_input: false

  - rule: Handle form responses during account verification - deny
    condition:
      - active_loop: account_verification_form
    steps:
      - intent: deny_has_account
      - action: account_verification_form
    wait_for_user_input: false

  - rule: Handle form responses during account verification - access confirm
    condition:
      - active_loop: account_verification_form
    steps:
      - intent: confirm_has_access
      - action: account_verification_form
    wait_for_user_input: false

  - rule: Handle form responses during account verification - access deny
    condition:
      - active_loop: account_verification_form
    steps:
      - intent: deny_has_access
      - action: account_verification_form
    wait_for_user_input: false

  - rule: Handle chitchat/ask_email during account verification form
    condition:
      - active_loop: account_verification_form
    steps:
      - intent: chitchat/ask_email
      - action: utter_ask_email

  - rule: Handle chitchat/ask_cni during account verification form
    condition:
      - active_loop: account_verification_form
      - slot_was_set:
          - platform: "PGDE"
    steps:
      - intent: chitchat/ask_cni
      - action: utter_ask_cni

  - rule: Soumettre le formulaire de vérification - Compte existant avec accès
    condition:
      - active_loop: account_verification_form
    steps:
      - action: account_verification_form
      - active_loop: null
      - slot_was_set:
          - has_account: "Oui"
          - has_access: "Oui"
      - action: utter_account_verified


  - rule: Gérer l'absence de compte
    condition:
      - active_loop: account_verification_form
    steps:
      - action: account_verification_form
      - active_loop: null
      - slot_was_set:
          - has_account: "Non"
          - email: null
          - cni: null
          - has_access: null
      - action: utter_no_account

  - rule: Gérer les problèmes d'accès
    condition:
      - active_loop: account_verification_form
    steps:
      - action: account_verification_form
      - active_loop: null
      - slot_was_set:
          - has_account: "Oui"
          - has_access: "Non"
          - email: null
          - cni: null
      - action: utter_no_access
  - rule: Demander accès après confirmation d’avoir un compte
    steps:
      - intent: confirm_has_account
      - action: utter_ask_has_access
  - rule: Rediriger création de compte si pas de compte
    steps:
      - intent: deny_has_account
      - action: utter_ask_pgde_account_creation
