version: "3.1"
rules:
  - rule: Aller vers E-Carrière par texte
    steps:
      - intent: E_carriere
      - action: utter_E_carriere

  - rule: Aller vers PGDE par texte
    steps:
      - intent: PGDE
      - action: utter_pgde_menu

  - rule: Aller vers CRCE par texte
    steps:
      - intent: CRCE
      - action: utter_crce_menu

  - rule: Aller vers Attestation par texte
    steps:
      - intent: Attestation
      - action: utter_attestation_menu

  - rule: Répondre au salut de l'utilisateur
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Expliquer la création de compte
    steps:
      - intent: ask_account_creation
      - action: action_explain_account_creation

  - rule: Expliquer la connexion
    steps:
      - intent: ask_login
      - action: action_explain_login

  - rule: Gérer une réponse inconnue
    steps:
      - intent: fallback
      - action: utter_fallback

  - rule: Gérer le retour utilisateur vers E-Carrière
    steps:
      - intent: go_back_ecarriere
      - action: utter_E_carriere

  - rule: Gérer le retour utilisateur vers PGDE
    steps:
      - intent: go_back_pgde
      - action: utter_pgde_menu

  - rule: Gérer le retour utilisateur vers Autres plateformes
    steps:
      - intent: go_back_autres
      - slot_was_set:
          - nom
      - action: utter_greet_with_name

  - rule: Rediriger vers la plateforme choisie
    steps:
      - intent: choose_platform
      - action: action_redirect_platform

  - rule: Retourner au menu principal avec le nom de l'utilisateur
    steps:
      - intent: go_back_greet_with_name
      - slot_was_set:
          - nom
      - action: utter_greet_with_name

  - rule: Saluer l'utilisateur avec le nom saisi - entity
    steps:
      - intent: provide_name
      - slot_was_set:
          - nom
      - action: utter_greet_with_name

  - rule: Saluer l'utilisateur avec le nom saisi - fallback
    steps:
      - intent: provide_name
      - action: action_handle_name

  - rule: Fallback pour capture du nom après salutation
    steps:
      - action: utter_greet
      - action: action_handle_name

  - rule: Gérer la réinitialisation du mot de passe
    steps:
      - intent: ask_password_reset
      - action: action_explain_password_reset

  - rule: Gérer le compte bloqué
    steps:
      - intent: ask_account_blocked
      - action: utter_no_access

  - rule: Gérer la demande d'attestation
    steps:
      - intent: ask_attestation_request
      - action: utter_ask_attestation_request

  - rule: Gérer le suivi d'attestation
    steps:
      - intent: ask_attestation_status
      - action: utter_ask_attestation_status

  - rule: Gérer les informations sur l'attestation
    steps:
      - intent: ask_attestation_info
      - action: utter_ask_attestation_info

  - rule: Gérer la création de compte attestation
    steps:
      - intent: ask_attestation_account
      - action: utter_ask_attestation_account

  - rule: Demander le support technique
    steps:
      - intent: ask_support
      - action: utter_ask_support

  - rule: Demander le numéro de dossier
    steps:
      - intent: ask_dossier_number
      - action: action_get_dossier_number

  - rule: Commencer la vérification de compte
    steps:
      - intent: start_account_verification
      - action: action_start_account_verification

  - rule: Gérer la réponse has_account
    steps:
      - intent: confirm_has_account
      - action: action_handle_has_account

  - rule: Gérer la réponse has_account - Non
    steps:
      - intent: deny_has_account
      - action: action_handle_has_account

  - rule: Gérer la réponse has_access
    steps:
      - intent: confirm_has_access
      - action: action_handle_has_access

  - rule: Gérer la réponse has_access - Non
    steps:
      - intent: deny_has_access
      - action: action_handle_has_access

  - rule: Gérer l'email fourni
    steps:
      - intent: provide_email
      - action: action_handle_email

  - rule: Gérer le CNI fourni
    steps:
      - intent: provide_cni
      - action: action_handle_cni

  - rule: Confirmer réinitialisation mot de passe
    steps:
      - intent: confirm_password_reset
      - action: action_confirm_password_reset

  - rule: Annuler réinitialisation mot de passe
    steps:
      - intent: deny_password_reset
      - action: action_deny_password_reset

  - rule: Gérer le matricule fourni
    steps:
      - intent: provide_matricule
      - action: action_handle_matricule

  - rule: Voir les actes de l'utilisateur
    steps:
      - intent: voir_actes
      - action: action_voir_actes

  - rule: Voir les projets de l'utilisateur
    steps:
      - intent: voir_projets
      - action: action_voir_projets

  - rule: Aucun projet ou acte disponible
    steps:
      - intent: aucun_projet_acte
      - action: action_aucun_projet_acte

  - rule: Retour au menu utilisateur
    steps:
      - intent: retour_menu_utilisateur
      - action: action_retour_menu_utilisateur

  - rule: Réinitialiser mot de passe E-Carrière
    steps:
      - intent: reset_password_ecarriere
      - action: action_reset_password_ecarriere

  - rule: Confirmer réinitialisation E-Carrière
    steps:
      - intent: confirm_reset_ecarriere
      - action: action_confirm_reset_ecarriere

  - rule: Annuler réinitialisation E-Carrière
    steps:
      - intent: cancel_reset_ecarriere
      - action: action_cancel_reset_ecarriere

