version: "3.1"

stories:
- story: User greets and provides name
  steps:
    - intent: greet
    - action: utter_greet
    - intent: provide_name
    - action: utter_greet_with_name
    - intent: choose_platform
    - action: action_redirect_platform

- story: User asks about account creation
  steps:
    - intent: ask_account_creation
    - action: utter_ask_account_creation
- story: User asks about login
  steps:
    - intent: ask_login
    - action: utter_ask_login
    - intent: go_back_ecarriere
    - action: utter_E_carriere

- story: User asks about PGDE account creation
  steps:
    - intent: ask_pgde_account_creation
    - action: utter_ask_pgde_account_creation
    - intent: go_back_pgde
    - action: utter_pgde_menu

- story: User asks about PGDE login
  steps:
    - intent: ask_pgde_login
    - action: utter_ask_pgde_login
    - intent: go_back_pgde
    - action: utter_pgde_menu

- story: User resets PGDE password
  steps:
    - intent: ask_pgde_password_reset
    - action: utter_ask_pgde_password_reset
    - intent: go_back_pgde
    - action: utter_pgde_menu


