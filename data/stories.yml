    - action: utter_ask_account_creation

- story: User asks about administrative acts follow-up
  steps:
    - intent: ask_acte_followup
    - action: utter_ask_acte_followup

- story: User asks about claim submission
  steps:
    - intent: ask_claim_submission
    - action: utter_ask_claim_submission

- story: User asks about hours
  steps:
    - intent: ask_hours
    - action: utter_ask_hours

- story: User asks about submission
  steps:
    - intent: ask_public_service_submission
    - action: utter_ask_public_service_submission
    - intent: go_back_ecarriere
    - action: utter_E_carriere

# pgde

- story: User asks about PGDE account creation
  steps:
    - intent: ask_pgde_account_creation
    - action: utter_ask_pgde_account_creation
    - intent: go_back_pgde
    - action: utter_pgde_menu

- story: User asks about PGDE login
  steps:
    - intent: ask_pgde_login
    - action: utter_ask_pgde_login
    - intent: go_back_pgde
    - action: utter_pgde_menu

- story: User asks about PGDE documents
  steps:
    - intent: ask_pgde_documents
    - action: utter_ask_pgde_documents
    - intent: go_back_pgde
    - action: utter_pgde_menu



- story: User resets PGDE password
  steps:
    - intent: ask_pgde_password_reset
    - action: utter_ask_pgde_password_reset
    - action: action_reset_pgde_password
    - slot_was_set:
      - awaiting_email: true
    - intent: nlu_fallback
      entities:
      - text: "utilisateur@example.com"
    - action: action_handle_email_input
    - action: action_reset_pgde_password
    - intent: go_back_pgde
    - action: utter_pgde_menu

# GIRAFE
- story: User asks for information
  steps:
    - intent: ask_user_info
    - action: utter_ask_matricule
    - intent: provide_matricule
      entities:
        - matricule: 741000D
    - action: action_retrieve_user_info


