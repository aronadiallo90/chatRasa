version: "3.1"
nlu:
  - intent: ask_document_info
    examples: |

      - Quelle est l'utilité de [E-Carrière](service) ?
  
      - Quels sont les objectifs de [E-Carrière](service) ?
      - Que fait [E-Carrière](service) ?  
      - Peux-tu me donner des infos sur [E-Carrière](service) ?
      - Qu'est-ce que [E-Carrière](service) ?
      - À quoi sert [E-Carrière](service) ?
      - Quelle est la mission de [E-Carrière](service) ?
      - Comment utiliser la plateforme [E-Carrière](service) ?
      - Quels services offre [E-Carrière](service) ?
      - Comment fonctionne [E-Carrière](service) ?
      - Où trouver plus d’informations sur [E-Carrière](service) ?
      - Peux-tu me donner des infos sur [les horaires]{"entity": "service"}
      - J’aimerais en savoir plus sur [les tarifs](service)
      - Où puis-je trouver des informations sur [la création de compte](service) ?
      - Quels sont les documents nécessaires pour [la fonction publique](service) ?
      - Je veux des détails sur [le dossier à soumettre](service)
      - Quels sont les [horaires](service) d’ouverture ?
      - Je veux tout savoir sur [le tutoriel](service)
      - Comment fonctionne [le chatbot](service) ?
      - Explique-moi comment faire une [inscription](service)
      - Quelle est la procédure d'[inscription](service) pour un [étudiant](user_type) ?
      - Comment [un professionnel](user_type) peut-il s’inscrire ?
      - Comment les [étudiants](user_type) peuvent s’enregistrer ?

  - intent: greet
    examples: |
      - Bonjour
      - Salut
      - Salut, comment ça va ?
      - Hello

  - intent: ask_help
    examples: |
      - Comment puis-je vous aider ?
      - Aidez-moi
      - Que puis-je faire ?
      - J'ai besoin d'aide

  - intent: ask_hours
    examples: |
      - Quels sont vos horaires ?
      - Quand êtes-vous ouvert ?
      - À quelle heure vous ouvrez ?

  - intent: ask_account_creation
    examples: |
      - Comment avoir un compte sur le site ?
      - Comment créer un compte ?
      - Comment m'inscrire ?

  - intent: ask_login
    examples: |
      - Comment se connecter ?
      - Comment puis-je me connecter ?
      - Où puis-je me connecter ?

  - intent: ask_tutorial_link
    examples: |
      - Donne-moi le lien du tutoriel pour me connecter.
      - Où puis-je trouver le tutoriel pour me connecter ?
      - Quel est le lien du tutoriel ?

  - intent: ask_public_service_application
    examples: |
      - Quel est le processus d'inscription pour postuler à la fonction publique ?
      - Comment postuler à la fonction publique ?
      - Quelles sont les étapes pour postuler à la fonction publique ?

  - intent: ask_public_service_steps
    examples: |
      - Quelles sont les étapes pour postuler à la fonction publique ?
      - Comment je procède pour postuler ?
      - Quelles démarches faut-il faire pour postuler ?

  - intent: ask_public_service_documents
    examples: |
      - Quels sont les documents nécessaires pour postuler à la fonction publique ?
      - Quels documents faut-il pour postuler ?
      - De quels papiers ai-je besoin pour postuler ?

  - intent: ask_public_service_submission
    examples: |
      - Quand puis-je soumettre ma candidature ?
      - Comment soumettre mon dossier de candidature ?
      - Que faire après avoir rempli ma candidature ?

  - intent: ask_public_service_confirmation
    examples: |
      - Quand recevrai-je la confirmation de ma candidature ?
      - Vais-je recevoir un email de confirmation ?
      - Comment savoir si ma candidature a bien été reçue ?

  - intent: fallback
    examples: |
      - Je ne comprends pas
      - C'est quoi ?
      - Pouvez-vous répéter ?
      - Je ne sais pas
  