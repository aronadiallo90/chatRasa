      - Revenir au menu [E-Carrière](service)
      - Retourner à [E-Carrière](service)

  - intent: ask_password_reset
    examples: |
      - J’ai oublié mon mot de passe, comment le réinitialiser sur [E-Carrière](service) ?
      - J’ai perdu mes accès, que faire sur [E-Carrière](service) ?
  
  - intent: fallback
    examples: |
      - Je ne comprends pas
      - Je ne sais pas

  - intent: ask_pgde_account_creation
