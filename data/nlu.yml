  - intent: ask_account_creation
    examples: |
      - Comment activer son  compte sur [E-Carrière](service) ?
      - Quels documents sont nécessaires pour l'activation sur [E-Carrière](service) ?

  - intent: ask_login
    examples: |
      - Comment me connecter à mon compte sur [E-Carrière](service) ?
      - Je ne trouve pas la page de connexion sur [E-Carrière](service) ?
      - J’ai des problèmes de connexion sur [E-Carrière](service), que faire ?
