version: "3.1"
nlu:
  - intent: greet
    examples: |
      - Bonjour
      - Hello
      - Salut
      - Coucou
      - Hey
      - Salam
      - Naka nga def ?
      - Jamm nga am ?
      - Naka suba si ?
      - Naka nga fanaane ?
