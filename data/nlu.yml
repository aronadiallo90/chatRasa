version: "3.1"
nlu:
  - intent: greet
    examples: |
      - Bonjour
      - Hello
      - Salut
      - Coucou
      - Hey
      - Salam
      - Naka nga def ?
      - Jamm nga am ?
      - Naka suba si ?
      - Naka nga fanaane ?
      - Nanga def ?
      - Jàmm rekk
      - Jërëjëf
      - retour

  - intent: choose_platform
    examples: |
      - Je veux voir [E-Carrière](platform)
      - Explorer [Autre plateforme](platform)
      - Montre-moi [PGDE](platform)
      - J’aimerais voir [PGDE](platform)

  

  - intent: ask_account_creation
    examples: |
      - Comment activer son compte sur [E-Carrière](service) ?
      - Quels documents sont nécessaires pour l'activation sur [E-Carrière](service) ?
      - Comment créer un compte sur [PGDE](platform) ?
      - Quels sont les documents nécessaires pour l'inscription sur [PGDE](platform) ?
      - Quelle est la procédure d’inscription sur [PGDE](platform) ?
      - Où créer un compte pour [PGDE](platform) ?
      - [PGDE](platform) créer un compte

  - intent: ask_login
    examples: |
      - Comment me connecter à mon compte sur [E-Carrière](service) ?
      - Je ne trouve pas la page de connexion sur [E-Carrière](service) ?
      - Comment me connecter à mon compte sur [PGDE](platform) ?
      - Où puis-je me connecter à [PGDE](platform) ?
      - Je ne trouve pas la page de connexion sur [PGDE](platform).
      - J’ai des problèmes de connexion sur [PGDE](platform), que faire ?
      - [PGDE](platform) se connecter

  - intent: ask_password_reset
    examples: |
      - J’ai oublié mon mot de passe, comment le réinitialiser sur [E-Carrière](service) ?
      - J’ai perdu mes accès, que faire sur [E-Carrière](service) ?
      - J'ai oublié mon mot de passe PGDE
      - Comment réinitialiser mon mot de passe sur [PGDE](platform) ?
      - Je n'arrive pas à me connecter à [PGDE](platform), j'ai perdu mon mot de passe
      - Mot de passe oublié [PGDE](platform)
      - Reset password [PGDE](platform)
      - Récupérer mot de passe [PGDE](platform)
  
  - intent: fallback
    examples: |
      - Je ne comprends pas
      - Je ne sais pas

  - intent: go_back_pgde
    examples: |
      - Retour au menu PGDE
      - Retour PGDE
      - Menu PGDE
      - Revenir au menu PGDE

  - intent: go_back_greet_with_name
    examples: |
      - Retour au menu principal
      - Retour à l'accueil
      - Revenir au menu principal
      - Retour accueil
      - Accueil
      - Retour au menu principal avec mon nom
      - Je veux revenir au menu principal avec mon nom


