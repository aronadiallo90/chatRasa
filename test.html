<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Rasa</title>
</head>
<body>
    <h1>Bienvenue sur le Chatbot</h1>
    <input type="text" id="userMessage" placeholder="Tapez votre message" />
    <button onclick="sendMessage()">Envoyer</button>
    <div id="botResponse"></div>

    <script>
      function sendMessage() {
        const userMessage = document.getElementById('userMessage').value;

        fetch("http://localhost:5005/webhooks/rest/webhook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sender: "test_user",
            message: userMessage
          })
        })
        .then(response => response.json())
        .then(data => {
          console.log(data);
          document.getElementById('botResponse').innerHTML = data.map(res => res.text).join('<br>');
        })
        .catch(error => {
          console.error('Erreur:', error);
        });
      }
    </script>
</body>
</html>
