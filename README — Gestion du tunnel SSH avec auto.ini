README — Gestion du tunnel SSH avec autossh et systemd
Description
Ce service systemd démarre un tunnel SSH local qui redirige le port local 3307 vers le port 3306 d’un serveur distant via SSH.

Fichier de service systemd utilisé
ini
Copier
Modifier
[Unit]
Description=Tunnel SSH autossh MySQL
After=network.target

[Service]
User=adminadie
ExecStart=/usr/bin/autossh -M 0 -L 3307:127.0.0.1:3306 adminadie@10.121.220.44 -p 3333 -N -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes
Restart=always
RestartSec=10

[Install]
WantedBy=multi-user.target
Commandes utiles
Démarrer le service
bash
Copier
Modifier
sudo systemctl start ssh-tunnel.service
Arrêter le service
bash
Copier
Modifier
sudo systemctl stop ssh-tunnel.service
Activer le service au démarrage du serveur
bash
Copier
Modifier
sudo systemctl enable ssh-tunnel.service
Désactiver le service au démarrage
bash
Copier
Modifier
sudo systemctl disable ssh-tunnel.service
Vérifier le statut du service
bash
Copier
Modifier
sudo systemctl status ssh-tunnel.service
Voir les logs en temps réel
bash
Copier
Modifier
sudo journalctl -fu ssh-tunnel.service
Vérification du tunnel
Vérifie que le port local 3307 est bien à l’écoute :

bash
Copier
Modifier
sudo lsof -i :3307
Teste la connexion MySQL via le tunnel :

bash
Copier
Modifier
mysql -h 127.0.0.1 -P 3307 -u root -p
Résolution des problèmes courants
Le port 3307 est déjà utilisé
Liste les processus et tue ceux qui utilisent le port :

bash
Copier
Modifier
sudo lsof -i :3307
sudo kill -9 <PID>
Le service ne démarre pas
Regarde les logs pour plus de détails :

bash
Copier
Modifier
sudo journalctl -u ssh-tunnel.service
Problème de clé SSH
Vérifie que l’utilisateur adminadie a accès à sa clé privée dans /home/adminadie/.ssh/ et que les permissions sont correctes (chmod 600).

Connexion refusée ou timeout MySQL
Assure-toi que le service MySQL tourne bien sur le serveur distant et écoute bien sur 127.0.0.1:3306.

