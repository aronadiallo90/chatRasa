<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="fr">

            display: flex;

        .chat-icon:hover {
            background: #006d32;

        #input-container {
            display: flex;

            background: #ffffff;
        }
        #user-input {
            flex: 1;
            padding: clamp(0.5rem, 2.5vw, 0.75rem);
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: clamp(0.8rem, 3.5vw, 0.9rem);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #user-input:focus {
            border-color: #00843F;
            box-shadow: 0 0 0 2px rgba(0, 132, 63, 0.2);
        }
        #user-input:disabled {
            background-color: #f3f4f6;

            cursor: not-allowed;
        }
        #send-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            opacity: 0.5;
        }
        #send-button {
            background: #00843F;
            color: #ffffff;
            border: none;
            border-radius: 0.375rem;
            padding: clamp(0.5rem, 2.5vw, 0.75rem) clamp(0.75rem, 3vw, 1rem);
            cursor: pointer;
            font-size: clamp(0.8rem, 3.5vw, 0.9rem);
            transition: background 0.2s;
        }
        #send-button:hover {
            background: #006d32;
        }
        .loading-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(0.5rem, 2vw, 0.75rem);
        }
        .dot {
            width: clamp(0.4rem, 1.5vw, 0.5rem);
            height: clamp(0.4rem, 1.5vw, 0.5rem);
            margin: 0 clamp(0.1rem, 0.5vw, 0.125rem);

            animation: dot-bounce 1.4s infinite ease-in-out both;

        .dot:nth-child(2) {

        @keyframes dot-bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);

        /* Tablet (min-width: 640px) */
        @media (min-width: 640px) {
            #chat-container {
                width: clamp(360px, 80vw, 450px);

                border-top-left-radius: 1rem;

            }

            #chat-container {

</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span><i class="fas fa-robot"></i> Amath (MFPRSP)</span>
        <div id="header-actions">
            <button onclick="restartChat()"><i class="fas fa-sync"></i></button>
            <button onclick="fermerChat()"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tapez votre message..." onkeydown="if(event.key === 'Enter') sendUserMessage();">
        <button id="send-button" onclick="sendUserMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div class="chat-actions">
    <div id="open-chat-icon" class="chat-icon" onclick="ouvrirChat()"><i class="fas fa-comments"></i></div>
</div>

<script>
    let lastButtons = [];
    let loadingIndicator;

    function appendMessage(text, sender) {
        let chatBox = document.getElementById("chat-box");
        let messageDiv = document.createElement("div");
        messageDiv.classList.add("message", sender === "bot" ? "bot-message" : sender === "error" ? "error-message" : sender === "info" ? "info-message" : "user-message");
        
        let formattedText = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, '<a href="$2" target="_blank" class="underline text-blue-500">$1</a>')
            .replace(/\n/g, '<br>');
        
        messageDiv.innerHTML = formattedText;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendButtons(buttons) {
        let chatBox = document.getElementById("chat-box");
        let buttonContainer = document.createElement("div");
        buttonContainer.classList.add("button-container");

        buttons.forEach(button => {
            let buttonElement = document.createElement("button");
            buttonElement.classList.add("chat-button");
            buttonElement.innerText = button.title;
            buttonElement.onclick = () => {
                appendMessage(button.title, "user");
                disableButtons();
                sendMessage(button.payload);
            };
            buttonContainer.appendChild(buttonElement);
        });

        lastButtons = buttonContainer;
        chatBox.appendChild(buttonContainer);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function disableButtons() {
        if (lastButtons && lastButtons.children) {
            Array.from(lastButtons.children).forEach(btn => btn.disabled = true);
        }
    }

    // Fonctions pour contrôler l'état de l'input
    function enableInput() {
        let userInput = document.getElementById("user-input");
        let sendButton = document.getElementById("send-button");
        userInput.disabled = false;
        userInput.placeholder = "Tapez votre message...";
        sendButton.disabled = false;
    }

    function disableInput() {
        let userInput = document.getElementById("user-input");
        let sendButton = document.getElementById("send-button");
        userInput.disabled = true;
        userInput.placeholder = "Utilisez les boutons ci-dessus...";
        sendButton.disabled = true;
    }

    function showLoadingIndicator() {
        let chatBox = document.getElementById("chat-box");
        loadingIndicator = document.createElement("div");
        loadingIndicator.classList.add("loading-indicator");
        loadingIndicator.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        chatBox.appendChild(loadingIndicator);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideLoadingIndicator() {
        if (loadingIndicator) {
            loadingIndicator.remove();
            loadingIndicator = null;
        }
    }

    
    function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

    let senderId = sessionStorage.getItem('sender_id') || generateUUID();
    sessionStorage.setItem('sender_id', senderId);

    function sendMessage(payload) {
        showLoadingIndicator();
        fetch("http://localhost:5005/webhooks/rest/webhook", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender: senderId, message: payload })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Erreur HTTP: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            hideLoadingIndicator();
            if (data.length === 0) {
                appendMessage("réessayer", "info");
                return;
            }
            let foundButtons = false;
            data.forEach(res => {
                if (res.text) appendMessage(res.text, "bot");
                if (res.buttons) {
                    foundButtons = true;
                    appendButtons(res.buttons);
                }
            });
            
            // Contrôler l'état de l'input basé sur la présence de boutons
            if (foundButtons) {
                disableInput(); // Désactiver l'input quand il y a des boutons
            } else {
                enableInput(); // Activer l'input quand il n'y a pas de boutons (pour saisie libre)
            }
        })
        .catch(error => {
            hideLoadingIndicator();
            console.error("Erreur:", error);
            appendMessage("Impossible de contacter le serveur. Veuillez vérifier votre connexion ou réessayer plus tard.", "error");
        });
    }

    function sendUserMessage() {
        let userInput = document.getElementById("user-input");
        let sendButton = document.getElementById("send-button");
        
        // Vérifier si l'input est physiquement désactivé
        if (userInput.disabled || sendButton.disabled) return;
        
        let message = userInput.value.trim();
        if (message === "") return;
        
        // Désactiver les boutons existants avant d'envoyer le message
        disableButtons();
        
        appendMessage(message, "user");
        sendMessage(message);
        userInput.value = "";
    }

    function restartChat() {
        // Vider l'affichage du chat
        document.getElementById("chat-box").innerHTML = "";
        
        // Réinitialiser l'état de l'input
        enableInput();
        
        // Réinitialiser la session côté serveur Rasa avant de générer un nouveau sender_id
        fetch(`http://localhost:5005/conversations/${senderId}/tracker/events`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                "event": "restart",
                "timestamp": Date.now() / 1000
            })
        })
        .then(() => {
            // Générer un nouveau sender_id pour créer une nouvelle session
            senderId = generateUUID();
            sessionStorage.setItem('sender_id', senderId);
            
            // Démarrer une nouvelle conversation
            sendMessage("/greet");
        })
        .catch(error => {
            console.warn("Erreur lors de la réinitialisation de la session:", error);
            // Même en cas d'erreur, continuer avec un nouveau sender_id
            senderId = generateUUID();
            sessionStorage.setItem('sender_id', senderId);
            sendMessage("/greet");
        });
    }

    function fermerChat() {
        document.getElementById("chat-container").style.display = "none";
        document.getElementById("open-chat-icon").style.display = "flex";
    }

    function ouvrirChat() {
        document.getElementById("chat-container").style.display = "flex";
        document.getElementById("open-chat-icon").style.display = "none";
    }

    window.onload = () => {
        // appendMessage("Connexion au serveur en cours...", "bot");
        sendMessage("/greet");
    };
</script>

</body>
</html>
