<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Chatbot Rasa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7;
        }
        #chat-container {
            width: 350px;
            height: 500px;
            border: 1px solid #00843F;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            display: none;
            z-index: 9999;
            transition: all 0.3s;
        }
        #chat-header {
            background: #00843F;
            color: white;
            padding: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }
        #header-actions {
            display: flex;
            gap: 10px;
        }
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 8px;
            margin: 5px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
            font-size: 1rem;
        }
        .bot-message {
            background-color: #e6e6e6;
            align-self: flex-start;
        }
        .user-message {
            background-color: #00843F;
            color: white;
            align-self: flex-end;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 8px;
        }
        .chat-button {
            margin: 5px 0;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background-color: #00843F;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .chat-button:active {
            background-color: #005f2f;
        }
        .chat-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        .chat-actions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }
        .chat-icon {
            background: #00843F;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        #input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #00843F;
            gap: 8px;
        }
        #user-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        #send-button {
            background: #408aa9;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 5px;
            transition: background 0.2s;
        }
        #send-button:active {
            background: #2c5e7a;
        }
        .loading-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 20px;
            margin: 5px;
        }
        .dot {
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background-color: #00843F;
            border-radius: 50%;
            display: inline-block;
            animation: dot-blink 1.4s infinite both;
        }
        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dot-blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }
        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 600px) {
            #chat-container {
                width: 100vw;
                max-width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                position: fixed;
                bottom: 0;
                right: 0;
                left: 0;
                top: 0;
                margin: 0;
                padding: 0;
            }
            #chat-header {
                font-size: 1.1rem;
                padding: 12px;
                border-radius: 0;
            }
            #chat-box {
                padding: 8px;
                font-size: 1rem;
            }
            .message {
                font-size: 1.05rem;
                padding: 10px;
                margin: 6px 2px;
                max-width: 95%;
            }
            .button-container {
                gap: 6px;
            }
            .chat-button {
                font-size: 1.05rem;
                padding: 12px 18px;
            }
            #input-container {
                padding: 8px;
                gap: 6px;
            }
            #user-input {
                font-size: 1.05rem;
                padding: 12px;
            }
            #send-button {
                font-size: 1.05rem;
                padding: 12px 18px;
            }
            .chat-actions {
                bottom: 10px;
                right: 10px;
            }
            .chat-icon {
                width: 45px;
                height: 45px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span>🤖 Amath (MFPRSP)</span>
        <div id="header-actions">
            <button onclick="restartChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;"><i class="fas fa-sync" style="color:rgb(241, 214, 125);"></i>
            </button>
            <button onclick="fermerChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;"><i class="fas fa-times" style="color:rgb(228, 123, 97);font-size: 1.5rem;" ></i>
            </button>
        </div>
    </div>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="..." onkeydown="if(event.key === 'Enter') sendUserMessage();">
        <button id="send-button" onclick="sendUserMessage()">➤</button>
    </div>
</div>

<div class="chat-actions">
    <div id="open-chat-icon" class="chat-icon" onclick="ouvrirChat()">💬</div>
</div>

<script>
    let lastButtons = [];
    let loadingIndicator;

    function appendMessage(text, sender) {
        let chatBox = document.getElementById("chat-box");
        let messageDiv = document.createElement("div");
        messageDiv.classList.add("message", sender === "bot" ? "bot-message" : "user-message");

        // Transformer les liens Markdown en liens HTML cliquables et les retours à la ligne en <br>
        let formattedText = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Mise en gras
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
            .replace(/\n/g, '<br>');

        // Insérer du HTML au lieu de texte brut
        messageDiv.innerHTML = formattedText;
        
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendButtons(buttons) {
        let chatBox = document.getElementById("chat-box");
        let buttonContainer = document.createElement("div");
        buttonContainer.classList.add("button-container");

        buttons.forEach(button => {
            let buttonElement = document.createElement("button");
            buttonElement.classList.add("chat-button");
            buttonElement.innerText = button.title;
            buttonElement.onclick = () => {
                appendMessage(button.title, "user"); // Afficher le texte du bouton comme message utilisateur
                disableButtons();
                sendMessage(button.payload);
            };
            buttonContainer.appendChild(buttonElement);
        });

        lastButtons = buttonContainer;
        chatBox.appendChild(buttonContainer);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function disableButtons() {
        if (lastButtons) {
            Array.from(lastButtons.children).forEach(btn => btn.disabled = true);
        }
    }

    function showLoadingIndicator() {
        let chatBox = document.getElementById("chat-box");
        loadingIndicator = document.createElement("div");
        loadingIndicator.classList.add("loading-indicator");
        loadingIndicator.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        chatBox.appendChild(loadingIndicator);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideLoadingIndicator() {
        if (loadingIndicator) {
            loadingIndicator.remove();
            loadingIndicator = null;
        }
    }

    function sendMessage(payload) {
        showLoadingIndicator();
        fetch("http://10.121.221.75:5005/webhooks/rest/webhook", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender: "user", message: payload })
        })
        .then(response => response.json())
        .then(data => {
            hideLoadingIndicator();
            let foundButtons = false;
            data.forEach(res => {
                if (res.text) appendMessage(res.text, "bot");
                if (res.buttons) {
                    foundButtons = true;
                    appendButtons(res.buttons);
                }
            });
            if (!foundButtons) appendButtons([{ title: "Retour", payload: "/go_back" }]);
        })
        .catch(error => {
            hideLoadingIndicator();
            console.error("Erreur:", error);
        });
    }

    function sendUserMessage() {
        let userInput = document.getElementById("user-input").value.trim();
        if (userInput === "") return;
        appendMessage(userInput, "user");
        sendMessage(userInput);
        document.getElementById("user-input").value = "";
    }

    function restartChat() {
        document.getElementById("chat-box").innerHTML = "";
        sendMessage("/greet");
    }

    function fermerChat() {
        document.getElementById("chat-container").style.display = "none";
        document.getElementById("open-chat-icon").style.display = "flex";
    }

    function ouvrirChat() {
        document.getElementById("chat-container").style.display = "flex";
        document.getElementById("open-chat-icon").style.display = "none";
    }

    window.onload = () => sendMessage("/greet");
</script>

</body>
</html>
