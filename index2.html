<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Rasa</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #chat-container {
            width: 350px;
            height: 500px;
            border: 1px solid #28a745; /* Vert */
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            display: none; /* Caché au départ */
        }
        #chat-header {
            background: #28a745; /* Vert */
            color: white;
            padding: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header-actions {
            display: flex;
            gap: 10px;
        }
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 8px;
            margin: 5px;
            border-radius: 8px;
            max-width: 80%;
        }
        .bot-message {
            background-color: #e6e6e6;
            align-self: flex-start;
        }
        .user-message {
            background-color: #28a745; /* Bleu */
            color: white;
            align-self: flex-end;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .chat-button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #28a745; /* Vert */
            color: white;
            cursor: pointer;
        }
        .chat-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        .chat-actions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .chat-icon {
            background: #28a745; /* Vert */
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        #input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #28a745;
        }
        #user-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #send-button {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span>🤖 Chatbot</span>
        <div id="header-actions">
            <button onclick="restartChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;">🔄</button>
            <button onclick="fermerChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;">✖️</button>
        </div>
        <!-- <button onclick="restartChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;">🔄</button>
        <button onclick="fermerChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;">✖️</button> -->
    </div>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Posez votre question..." onkeydown="if(event.key === 'Enter') sendUserMessage();">
        <button id="send-button" onclick="sendUserMessage()">➤</button>
    </div>
</div>

<div class="chat-actions">
    <div id="open-chat-icon" class="chat-icon" onclick="ouvrirChat()">💬</div>
</div>


<script src="script.js"></script>
</body>
</html>
