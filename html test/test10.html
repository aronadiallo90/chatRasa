<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Rasa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            position: relative;
        }
        #chat-container {
            width: 350px;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: white;
            display: none;
        }
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            max-height: 430px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .message {
            padding: 8px;
            margin: 5px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        .bot-message {
            background-color: #e6e6e6;
            align-self: flex-start;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .chat-button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #6200ea;
            color: white;
            cursor: pointer;
        }
        .chat-button:hover {
            background-color: #3700b3;
        }
        #chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: blue;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>

<button id="chat-toggle">💬</button>
<div id="chat-container">
    <div id="chat-box"></div>
</div>

<script>
  document.getElementById("chat-toggle").addEventListener("click", function() {
      let chatContainer = document.getElementById("chat-container");
      chatContainer.style.display = chatContainer.style.display === "none" ? "block" : "none";
  });

  function appendMessage(text, sender) {
      let chatBox = document.getElementById("chat-box");
      let messageDiv = document.createElement("div");
      messageDiv.classList.add("message", sender === "bot" ? "bot-message" : "user-message");
      messageDiv.innerText = text;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendButtons(buttons) {
      let chatBox = document.getElementById("chat-box");
      let buttonContainer = document.createElement("div");
      buttonContainer.classList.add("button-container");

      buttons.forEach(button => {
          let buttonElement = document.createElement("button");
          buttonElement.classList.add("chat-button");
          buttonElement.innerText = button.title;
          buttonElement.onclick = () => sendMessage(button.payload);
          buttonContainer.appendChild(buttonElement);
      });

      chatBox.appendChild(buttonContainer);
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMessage(payload) {
      fetch("http://localhost:5005/webhooks/rest/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender: "user", message: payload })
      })
      .then(response => response.json())
      .then(data => {
          data.forEach(res => {
              if (res.text) appendMessage(res.text, "bot");
              if (res.buttons) appendButtons(res.buttons);
          });
      })
      .catch(error => console.error("Erreur:", error));
  }

  window.onload = () => sendMessage("/greet");
</script>

</body>
</html>
