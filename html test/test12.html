<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Rasa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #chat-container {
            width: 350px;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
        }
        #chat-header {
            background: #6200ea;
            color: white;
            padding: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 8px;
            margin: 5px;
            border-radius: 8px;
            max-width: 80%;
        }
        .bot-message {
            background-color: #e6e6e6;
            align-self: flex-start;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .chat-button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #6200ea;
            color: white;
            cursor: pointer;
        }
        .chat-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span>🤖 Chatbot</span>
        <button onclick="restartChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:16px;">🔄</button>
    </div>
    <div id="chat-box"></div>
</div>

<script>
  let lastButtons = [];

  function appendMessage(text, sender) {
      let chatBox = document.getElementById("chat-box");
      let messageDiv = document.createElement("div");
      messageDiv.classList.add("message", sender === "bot" ? "bot-message" : "user-message");
      messageDiv.innerText = text;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendButtons(buttons) {
      let chatBox = document.getElementById("chat-box");
      let buttonContainer = document.createElement("div");
      buttonContainer.classList.add("button-container");

      buttons.forEach(button => {
          let buttonElement = document.createElement("button");
          buttonElement.classList.add("chat-button");
          buttonElement.innerText = button.title;
          buttonElement.onclick = () => {
              disableButtons();
              sendMessage(button.payload);
          };
          buttonContainer.appendChild(buttonElement);
      });

      lastButtons = buttonContainer;
      chatBox.appendChild(buttonContainer);
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  function disableButtons() {
      if (lastButtons) {
          Array.from(lastButtons.children).forEach(btn => btn.disabled = true);
      }
  }

  function sendMessage(payload) {
      fetch("http://localhost:5005/webhooks/rest/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender: "user", message: payload })
      })
      .then(response => response.json())
      .then(data => {
          let foundButtons = false;
          data.forEach(res => {
              if (res.text) appendMessage(res.text, "bot");
              if (res.buttons) {
                  foundButtons = true;
                  appendButtons(res.buttons);
              }
          });
          if (!foundButtons) appendButtons([{ title: "Retour", payload: "/go_back" }]);
      })
      .catch(error => console.error("Erreur:", error));
  }

  function restartChat() {
      document.getElementById("chat-box").innerHTML = "";
      sendMessage("/greet");
  }

  window.onload = () => sendMessage("/greet");
</script>

</body>
</html>
