<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ChatBot</title>
    <script src="https://cdn.jsdelivr.net/npm/rasa-webchat/lib/index.js"></script>
</head>
<body>

<script>
  window.onload = () => {
    window.WebChat.default(
      {
        initPayload: "/greet",
        customData: { language: "fr" }, 
        socketUrl: "http://localhost:5005", // Mets l'URL de ton serveur Rasa
        title: "Assistant Virtuel",
        subtitle: "Posez-moi vos questions !",
        showCloseButton: true,
        embedded: false,
      },
      null
    );
  };
</script>

</body>
</html>
