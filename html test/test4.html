<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/rasa-webchat/lib/index.min.js"></script>
<script>
  window.onload = () => {
    WebChat.default({
      initPayload: "/greet",
      customData: { language: "fr" }, // Personnalisation des données envoyées
      socketUrl: "http://localhost:5005", // Adresse de votre serveur Rasa
      title: "Chatbot",
      subtitle: "Je suis là pour vous aider",
      inputTextFieldHint: "Écrivez un message...",
    }, null);
  };
</script>

</body>
</html>
