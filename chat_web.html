<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Amath - Ministère de la Fonction Publique</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.5em;
        }
        
        .header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        
        #chat-container {
            height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .bot-message {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
        }
        
        .bot-message strong {
            color: #2196F3;
        }
        
        #input-container {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }
        
        #message-input:focus {
            border-color: #2196F3;
        }
        
        #send-btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        #send-btn:hover {
            transform: scale(1.05);
        }
        
        #send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing {
            color: #666;
            font-style: italic;
            padding: 8px 16px;
        }
        
        .error {
            background: #ffebee !important;
            border: 1px solid #ef5350 !important;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Assistant Amath</h1>
            <p>Ministère de la Fonction Publique et de la Réforme du Service Public</p>
        </div>
        
        <div id="chat-container">
            <div id="messages">
                <div class="message bot-message">
                    <strong>Dalal ak Jàmm !</strong> 😊<br>
                    Je suis Amath, votre assistant virtuel.<br>
                    Comment puis-je vous aider aujourd'hui ?
                </div>
            </div>
            
            <div id="input-container">
                <input type="text" id="message-input" placeholder="Tapez votre message..." maxlength="500">
                <button id="send-btn">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        
        // Configuration
        const API_URL = 'http://localhost:5006/webhooks/rest/webhook';
        const USER_ID = 'web-user-' + Math.random().toString(36).substr(2, 9);
        
        function addMessage(text, isUser, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}${isError ? ' error' : ''}`;
            
            if (isUser) {
                messageDiv.textContent = text;
            } else {
                // Permettre le HTML/Markdown simple pour les réponses du bot
                messageDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                          .replace(/\*(.*?)\*/g, '<em>$1</em>')
                                          .replace(/\n/g, '<br>');
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            return messageDiv;
        }
        
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing';
            typingDiv.textContent = 'Amath écrit...';
            typingDiv.id = 'typing-indicator';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return typingDiv;
        }
        
        function hideTyping() {
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Désactiver l'interface
            sendBtn.disabled = true;
            messageInput.disabled = true;
            
            // Afficher le message de l'utilisateur
            addMessage(message, true);
            messageInput.value = '';
            
            // Afficher l'indicateur de frappe
            const typingIndicator = showTyping();
            
            // Envoyer à Rasa
            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    sender: USER_ID,
                    message: message
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                hideTyping();
                
                if (data && data.length > 0) {
                    data.forEach(response => {
                        if (response.text) {
                            addMessage(response.text, false);
                        }
                    });
                } else {
                    addMessage('Désolé, je n\'ai pas compris. Pouvez-vous reformuler ?', false);
                }
            })
            .catch(error => {
                hideTyping();
                console.error('Error:', error);
                addMessage('❌ Erreur de connexion. Vérifiez que le serveur Rasa fonctionne sur le port 5006.', false, true);
            })
            .finally(() => {
                // Réactiver l'interface
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            });
        }
        
        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });
        
        // Focus sur l'input au chargement
        messageInput.focus();
        
        // Messages de test pour vérifier la connexion
        console.log('🤖 Assistant Amath prêt !');
        console.log('📡 API URL:', API_URL);
        console.log('👤 User ID:', USER_ID);
    </script>
</body>
</html>
